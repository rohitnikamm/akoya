name: windows

on:
  push:
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Prepare output folder
        shell: pwsh
        run: New-Item -ItemType Directory -Force out | Out-Null

      # The cache holds the pinned tarball (key = its SHA-256 from ModelManifest.cs).
      - name: Restore speech model cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/akoya-model-cache
          key: parakeet-tdt-0.6b-v2-int8-157c157bc51155e03e37d2466522a3a737dd9c72bb25f36eb18912964161e1ad

      # The model step must not stop the build and test steps: it records why it failed in
      # out/model-failure.txt (shown by the summary) and the run is failed at the end.
      - name: Stage speech model
        id: model-stage
        continue-on-error: true
        shell: pwsh
        run: |
          try {
            $dest = Join-Path $env:RUNNER_TEMP 'builtin'
            $cache = Join-Path $env:RUNNER_TEMP 'akoya-model-cache'
            $tarball = Join-Path $cache 'sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8.tar.bz2'
            $hit = Test-Path $tarball
            pwsh windows/scripts/stage-model.ps1 -Destination $dest -CacheDir $cache
            if ($LASTEXITCODE -ne 0) { throw 'stage-model.ps1 failed' }
            "tarball cache: " + $(if ($hit) { 'hit' } else { 'miss (downloaded)' }) | Add-Content -Path out/model-cache.txt
            # SherpaTranscriberTests also need test_wavs, which the staged (shipped) folder does not have.
            $full = Join-Path $env:RUNNER_TEMP 'model'
            New-Item -ItemType Directory -Force $full | Out-Null
            tar -xjf $tarball -C $full
            if ($LASTEXITCODE -ne 0) { throw 'model extraction failed' }
            $dir = Join-Path $full 'sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8'
            "AKOYA_MODEL_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "AKOYA_BUILT_IN_MODELS=$(Join-Path $dest 'models')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } catch {
            Add-Content -Path out/model-failure.txt -Value "model stage step: $($_.Exception.Message)"
            throw
          }

      - name: Build
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet build windows/Akoya.Windows.slnx -c Release 2>&1 | Tee-Object -FilePath out/build.log
          exit $LASTEXITCODE

      - name: Test
        id: test
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          AKOYA_SNAPSHOT_DIR: ${{ github.workspace }}\out\snapshots
        run: |
          dotnet test windows/Akoya.Windows.slnx -c Release --no-build --logger trx --results-directory out/tests 2>&1 | Tee-Object -FilePath out/test.log
          exit $LASTEXITCODE

      - name: Smoke run (start the built app, exit after 5 s)
        id: smoke
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          AKOYA_SMOKE: '1'
        run: |
          $report = 'out/smoke.txt'
          function Report([string]$text) { Add-Content -Path $report -Value $text; Write-Host $text }
          $exe = 'windows/src/Akoya.App/bin/Release/net10.0-windows/win-x64/Akoya.App.exe'
          $log = Join-Path $env:LOCALAPPDATA 'Akoya\logs\akoya.log'
          Remove-Item -Force -ErrorAction SilentlyContinue $log
          $p = Start-Process -FilePath $exe -PassThru
          $null = $p.Handle # keeps the exit code readable after exit
          if (-not $p.WaitForExit(60000)) {
            $p.Kill()
            Report 'FAILED: the app did not exit within 60 s'
            exit 1
          }
          $text = if (Test-Path $log) { Get-Content -Raw $log } else { '' }
          if (Test-Path $log) { Copy-Item $log out/smoke-akoya.log }
          Report "exit code: $($p.ExitCode)"
          $failures = @()
          if ($p.ExitCode -ne 0) { $failures += "exit code $($p.ExitCode)" }
          if ($text -notmatch 'INFO Akoya \S+ starting') { $failures += 'no startup line in the log' }
          if ($text -notmatch 'INFO Smoke run finished') { $failures += 'the smoke timer never fired' }
          if ($text -notmatch 'INFO Akoya stopping') { $failures += 'no clean shutdown line' }
          if ($text -match 'could not start') { $failures += 'the log says it could not start' }
          Report '--- akoya.log ---'
          Report $text
          if ($failures.Count -gt 0) {
            Report ('FAILED: ' + ($failures -join '; '))
            Write-Host "::error title=Smoke run::$($failures -join '; ')"
            exit 1
          }
          Report 'PASSED'

      - name: Summarize
        if: always()
        shell: pwsh
        run: pwsh windows/scripts/ci-summary.ps1 out

      - name: Publish results to ci-output
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # One results branch per source branch, so parallel task branches don't overwrite each other.
          if [ "$BRANCH" = "windows-design" ]; then results="ci-output"; else results="ci-output-${BRANCH//\//-}"; fi
          work="$RUNNER_TEMP/ci-output"
          rm -rf "$work"
          mkdir -p "$work/runs/$SHA"
          mkdir -p out
          cp -r out/. "$work/runs/$SHA/"
          cd "$work"
          git init -q -b "$results"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "ci output for $SHA"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git push --force origin "$results"

      - name: Fail if build or tests failed
        if: ${{ always() && (steps.build.outcome != 'success' || steps.test.outcome != 'success' || steps.smoke.outcome != 'success' || steps.model-stage.outcome == 'failure') }}
        shell: pwsh
        run: |
          Write-Host "build: ${{ steps.build.outcome }}, test: ${{ steps.test.outcome }}, smoke: ${{ steps.smoke.outcome }}, model stage: ${{ steps.model-stage.outcome }}"
          exit 1

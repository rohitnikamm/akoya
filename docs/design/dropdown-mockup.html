<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Akoya dropdown, V2 widget glow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
@keyframes akoyaBreath{0%,100%{opacity:0.45}50%{opacity:1}}
</style>
</helmet>
<div style="width: 560px; height: 560px; position: relative; overflow: hidden; background: radial-gradient(circle at 20% 70%, #24124a 0, transparent 50%), radial-gradient(circle at 90% 10%, #1b1f5c 0, transparent 45%), #06060c; font-family: 'Outfit', -apple-system, system-ui, sans-serif; color: #ffffff;">

  <div style="height: 30px; display: flex; align-items: center; justify-content: flex-end; padding: 0 12px; background: rgba(0,0,0,0.45); font-family: -apple-system, system-ui, sans-serif; font-size: 13px;">
    <div style="width: 28px; height: 22px; border-radius: 6px; background: rgba(129,140,248,0.30); display: flex; align-items: center; justify-content: center;">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="6" width="2" height="4" rx="1" fill="#fff"></rect><rect x="4" y="4" width="2" height="8" rx="1" fill="#fff"></rect><rect x="7" y="2" width="2" height="12" rx="1" fill="#fff"></rect><rect x="10" y="4" width="2" height="8" rx="1" fill="#fff"></rect><rect x="13" y="6" width="2" height="4" rx="1" fill="#fff"></rect></svg>
    </div>
    <svg width="17" height="14" viewBox="0 0 17 14" aria-hidden="true" style="margin-left: 12px;"><path d="M1.5 5.2a10 10 0 0 1 14 0" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"></path><path d="M4 7.8a6.4 6.4 0 0 1 9 0" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"></path><path d="M6.6 10.4a2.7 2.7 0 0 1 3.8 0" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"></path></svg>
    <svg width="26" height="13" viewBox="0 0 26 13" aria-hidden="true" style="margin-left: 14px;"><rect x="0.75" y="0.75" width="21.5" height="11.5" rx="3.2" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.5"></rect><rect x="2.5" y="2.5" width="15" height="8" rx="1.8" fill="#fff"></rect></svg>
    <span style="margin-left: 14px;">Fri 9:41 AM</span>
  </div>

  <div style="position: absolute; top: 40px; right: 92px; width: 320px; padding: 14px; box-sizing: border-box; border-radius: 30px; background: linear-gradient(180deg, #11112a 0%, #08080f 100%); box-shadow: 0 30px 70px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.07); display: flex; flex-direction: column; gap: 12px;">

    <div style="position: relative; padding: 18px 16px 16px; border-radius: 24px; overflow: hidden; background: #000218; box-shadow: inset 0 -8px 16px -6px rgba(28,44,124,0.75), inset 0 1px 3px 0 rgba(140,132,186,0.9), inset 0 18px 30px -8px rgba(120,112,172,0.75), inset 0 0 6px 1px rgba(108,104,158,0.85), inset 0 0 20px 6px rgba(72,78,146,0.8), inset 0 0 40px 12px rgba(38,50,126,0.85), inset 0 0 64px 16px rgba(16,30,98,0.8); display: flex; flex-direction: column; align-items: center; gap: 12px;">
      <div style="position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 18px 30px -8px rgba(150,140,210,0.45), inset 0 0 24px 8px rgba(96,104,186,0.45); animation: akoyaBreath 2.2s ease-in-out infinite; pointer-events: none;"></div>
      <div style="position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1.2px); background-size: 10px 10px;"></div>
      <div style="position: relative; width: 100%; display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 14px; font-weight: 600; letter-spacing: 0.01em;">akoya</span>
        <span style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: rgba(255,255,255,0.75);"><span style="width: 6px; height: 6px; border-radius: 3px; background: #a5b4fc; box-shadow: 0 0 8px #818cf8;"></span>Ready</span>
      </div>
      <div style="position: relative; height: 56px; display: flex; align-items: center; gap: 7px;">
        <sc-for list="{{logoCols}}" as="col" hint-placeholder-count="5">
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <sc-for list="{{col.dots}}" as="d" hint-placeholder-count="3">
              <div style="width: 6px; height: 6px; border-radius: 3px; background: #ffffff; box-shadow: 0 0 4px rgba(165,180,252,0.5);"></div>
            </sc-for>
          </div>
        </sc-for>
      </div>
      <div style="position: relative; display: flex; align-items: center; gap: 8px; font-size: 13px; color: rgba(255,255,255,0.75);">
        <span>Hold</span>
        <span style="padding: 2px 9px; border-radius: 7px; background: rgba(255,255,255,0.10); border: 1px solid rgba(165,180,252,0.35); font-size: 12px; font-weight: 600; color: #fff;">Right ⌘</span>
        <span>to talk</span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 99px; background: #14142a; font-size: 13px;">
      <div style="padding: 7px 0; border-radius: 99px; background: linear-gradient(180deg, #4f46e5, #3730a3); text-align: center; font-weight: 600;">Hold to talk</div>
      <div style="padding: 7px 0; border-radius: 99px; text-align: center; color: rgba(255,255,255,0.6);">Tap to toggle</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 20px; background: linear-gradient(180deg, #151530, #0d0d1a); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 11px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: rgba(255,255,255,0.45);">Last dictation</span>
        <span style="font-size: 11px; color: #a5b4fc;">Copy</span>
      </div>
      <span style="font-size: 13px; color: rgba(255,255,255,0.88); line-height: 1.4;">Hey team, I pushed the fix for the login bug. Can someone review it before lunch?</span>
    </div>

    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="flex-grow: 1; padding: 9px 0; border-radius: 99px; background: #14142a; text-align: center; font-size: 13px; color: rgba(255,255,255,0.85);">Settings</div>
      <div style="width: 36px; height: 36px; border-radius: 18px; background: #e8e8f0; display: flex; align-items: center; justify-content: center;">
        <svg width="14" height="14" viewBox="0 0 14 14" role="img" aria-label="Quit Akoya"><path d="M7 1.8v4.6" stroke="#111" stroke-width="1.6" stroke-linecap="round"></path><path d="M4.2 3.6a4.6 4.6 0 1 0 5.6 0" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round"></path></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const heights = [2, 4, 6, 4, 2];
    return { logoCols: heights.map((n) => ({ dots: Array.from({ length: n }, (_, i) => i) })) };
  }
}
</script>
</body>
</html>

.card{position:relative;overflow:hidden;width:420px;height:520px;box-sizing:border-box;border-radius:52px;background:radial-gradient(ellipse at 50% -5%,rgba(99,102,241,0.30) 0,rgba(91,33,182,0.14) 38%,transparent 66%),#0b0b18;box-shadow:inset 0 1px 0 rgba(255,255,255,0.07)}
.ov{position:absolute;inset:0;border-radius:inherit}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,0.06) 1px,transparent 1.3px);background-size:12px 12px}
.in{position:relative;height:100%;box-sizing:border-box;padding:40px 32px 28px;display:flex;flex-direction:column;align-items:center;gap:18px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.hint{font-size:15px;color:rgba(255,255,255,.8)} .hint b{padding:3px 10px;border-radius:8px;background:rgba(255,255,255,.1);border:1px solid rgba(165,180,252,.35);font-weight:600}
.wave{height:70px;display:flex;align-items:center;gap:5px;margin-top:8px} .col{display:flex;flex-direction:column;gap:3px} .col i{display:block;width:5px;height:5px;border-radius:3px;background:#c7d2fe}
.txt{width:100%;box-sizing:border-box;min-height:96px;padding:14px 16px;border-radius:22px;background:rgba(40,40,58,.6);font-size:16px;line-height:1.45}
.done{width:100%;padding:13px 0;border-radius:99px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.4);text-align:center;font-size:15px;font-weight:600}

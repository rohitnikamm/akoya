<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap"><style>
body{margin:0;background:#04060d;font-family:Outfit,system-ui,sans-serif;color:#fff;display:grid;grid-template-columns:repeat(3,420px) 320px;gap:36px;padding:30px;align-items:start}
.cap{font-size:14px;color:#aaa;margin-bottom:10px}
.card{position:relative;overflow:hidden;width:420px;height:520px;border-radius:52px}
.ov{position:absolute;inset:0;border-radius:inherit}
.grid{position:absolute;left:0;right:0;bottom:0;height:55%;background-image:linear-gradient(rgba(80,140,255,0.07) 1px,transparent 1px),linear-gradient(90deg,rgba(80,140,255,0.07) 1px,transparent 1px);background-size:34px 34px;-webkit-mask-image:linear-gradient(to top,#000 30%,transparent)}
.in{position:relative;height:100%;box-sizing:border-box;padding:40px 32px 28px;display:flex;flex-direction:column;align-items:center;gap:18px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.hint{font-size:15px;color:rgba(255,255,255,.8)} .hint b{padding:3px 10px;border-radius:8px;background:rgba(255,255,255,.1);border:1px solid rgba(140,180,255,.35);font-weight:600}
.txt{width:100%;box-sizing:border-box;min-height:96px;padding:14px 16px;border-radius:22px;background:rgba(30,36,58,.6);font-size:16px;line-height:1.45;margin-top:80px}
.done{width:100%;padding:13px 0;border-radius:99px;background:rgba(255,255,255,.12);text-align:center;font-size:15px;font-weight:600;color:rgba(255,255,255,.7)}
.panel{width:320px;padding:14px;box-sizing:border-box;border-radius:30px;background:linear-gradient(180deg,#0e1424 0%,#070a12 100%);display:flex;flex-direction:column;gap:12px}
.cc{position:relative;overflow:hidden;height:152px;border-radius:24px;background:#020611}
.cc .lbl{position:absolute;top:16px;left:16px;font-weight:600}
.row{height:36px;border-radius:99px;background:rgba(30,36,58,.8)}
</style></head><body>
<div><div class="cap">Blue · rest</div><div class="card" style="background:radial-gradient(ellipse at 50% 0%,rgba(40,90,200,0.18) 0,transparent 60%),#03060f"><div class="ov" style="box-shadow:inset 0 -6px 10px -2px rgba(200,228,255,0.95), inset 0 -26px 34px -8px rgba(90,160,255,0.9), inset 0 -70px 70px -20px rgba(30,100,255,0.7), inset 0 -130px 110px -40px rgba(20,70,220,0.4), inset 0 12px 26px -14px rgba(90,150,255,0.35), inset 0 0 5px 1px rgba(110,170,255,0.45), inset 0 0 22px 4px rgba(30,90,230,0.4), inset 0 0 50px 10px rgba(14,50,170,0.3);opacity:0"></div><div class="grid" style="opacity:0.4"></div>
<div class="in"><span class="eyebrow">Try it</span><div class="hint">Hold <b>Right ⌘</b> and say anything</div><div class="txt" style="color:rgba(255,255,255,.4)">Your words will appear here.</div><div style="flex-grow:1"></div><div class="done">Done</div></div></div></div><div><div class="cap">Blue · mid speech</div><div class="card" style="background:radial-gradient(ellipse at 50% 0%,rgba(40,90,200,0.18) 0,transparent 60%),#03060f"><div class="ov" style="box-shadow:inset 0 -6px 10px -2px rgba(200,228,255,0.95), inset 0 -26px 34px -8px rgba(90,160,255,0.9), inset 0 -70px 70px -20px rgba(30,100,255,0.7), inset 0 -130px 110px -40px rgba(20,70,220,0.4), inset 0 12px 26px -14px rgba(90,150,255,0.35), inset 0 0 5px 1px rgba(110,170,255,0.45), inset 0 0 22px 4px rgba(30,90,230,0.4), inset 0 0 50px 10px rgba(14,50,170,0.3);opacity:0.55"></div><div class="grid" style="opacity:0.73"></div>
<div class="in"><span class="eyebrow">Try it</span><div class="hint">Hold <b>Right ⌘</b> and say anything</div><div class="txt" style="color:#fff">Okay, this is actually</div><div style="flex-grow:1"></div><div class="done">Done</div></div></div></div><div><div class="cap">Blue · peak</div><div class="card" style="background:radial-gradient(ellipse at 50% 0%,rgba(40,90,200,0.18) 0,transparent 60%),#03060f"><div class="ov" style="box-shadow:inset 0 -6px 10px -2px rgba(200,228,255,0.95), inset 0 -26px 34px -8px rgba(90,160,255,0.9), inset 0 -70px 70px -20px rgba(30,100,255,0.7), inset 0 -130px 110px -40px rgba(20,70,220,0.4), inset 0 12px 26px -14px rgba(90,150,255,0.35), inset 0 0 5px 1px rgba(110,170,255,0.45), inset 0 0 22px 4px rgba(30,90,230,0.4), inset 0 0 50px 10px rgba(14,50,170,0.3);opacity:1"></div><div class="grid" style="opacity:1.0"></div>
<div class="in"><span class="eyebrow">Try it</span><div class="hint">Hold <b>Right ⌘</b> and say anything</div><div class="txt" style="color:#fff">Okay, this is actually really smooth.</div><div style="flex-grow:1"></div><div class="done">Done</div></div></div></div>
<div><div class="cap">Dropdown card · listening peak</div><div class="panel"><div class="cc"><div class="ov" style="box-shadow:inset 0 -4px 7px -2px rgba(200,228,255,0.95), inset 0 -16px 22px -6px rgba(90,160,255,0.9), inset 0 -40px 44px -14px rgba(30,100,255,0.7), inset 0 -70px 60px -24px rgba(20,70,220,0.4), inset 0 8px 16px -9px rgba(90,150,255,0.35), inset 0 0 4px 1px rgba(110,170,255,0.45), inset 0 0 14px 3px rgba(30,90,230,0.4), inset 0 0 30px 6px rgba(14,50,170,0.3)"></div><span class="lbl">akoya</span></div><div class="row"></div><div class="row" style="height:80px;border-radius:20px"></div><div class="row"></div></div></div>
</body></html>
